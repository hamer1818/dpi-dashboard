[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dpi-dashboard"
dynamic = ["version"]
description = "A small desktop panel to switch a DPI-bypass service (zapret, GoodbyeDPI) on and off and check that it works."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "hamer1818" }]
keywords = ["dpi", "zapret", "goodbyedpi", "censorship", "discord", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = ["PyQt6>=6.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.gui-scripts]
dpi-dashboard = "dpi_dashboard.app:main"

[project.urls]
Homepage = "https://github.com/hamer1818/dpi-dashboard"
Issues = "https://github.com/hamer1818/dpi-dashboard/issues"

[tool.setuptools.dynamic]
version = { attr = "dpi_dashboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpi_dashboard = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dpi_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

name: Release

on:
  push:
    tags: ["v*"]
    # Builds also run on feature branches so packaging changes are tested before a tag;
    # only a tag publishes.
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Exact versions with hashes: a changed or replaced package on PyPI fails the build.
      - run: pip install --require-hashes -r packaging/requirements/release-windows.txt
      - run: pip install --no-deps --no-build-isolation .
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name dpi-dashboard
          --icon src/dpi_dashboard/assets/icon.ico
          --collect-data dpi_dashboard
          --add-data "LICENSE;licenses"
          --add-data "THIRD_PARTY_NOTICES.md;licenses"
          --add-data "licenses;licenses"
          packaging/windows/entry.py
      - name: The program carries its license texts
        run: |
          $list = pyi-archive_viewer --list --recursive dist\dpi-dashboard.exe
          $list | Select-String -Pattern 'licen|NOTICES' | ForEach-Object { $_.Line.Trim() }
          foreach ($f in 'GPL-3.0.txt', 'LGPL-3.0.txt', 'Python-PSF-2.0.txt', 'LICENSE', 'THIRD_PARTY_NOTICES.md') {
            if (-not ($list | Select-String -Pattern ('licenses[\\/]+' + [regex]::Escape($f)))) { throw "missing from the exe: $f" }
          }
      - name: License texts for the release
        shell: pwsh
        run: Compress-Archive -Path LICENSE, THIRD_PARTY_NOTICES.md, licenses -DestinationPath dist\licenses.zip
      - name: Check that the packaged app starts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process dist\dpi-dashboard.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/dpi-dashboard.exe
            dist/licenses.zip

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r packaging/requirements/release-python.txt
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the build provenance
      attestations: write   # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Name the Windows build and write checksums
        run: |
          mv artifacts/dpi-dashboard.exe "artifacts/dpi-dashboard-${GITHUB_REF_NAME}-windows-x64.exe"
          mv artifacts/licenses.zip "artifacts/dpi-dashboard-${GITHUB_REF_NAME}-licenses.zip"
          cd artifacts && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # Lets anyone check that a file came from this workflow:
      #   gh attestation verify FILE --repo hamer1818/dpi-dashboard
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "DPI Dashboard $GITHUB_REF_NAME"

# Runs the real setup on fresh CI machines: download and verify zapret, install it as a
# service, pick a strategy, check that the bypass process runs and that the internet still
# works, then uninstall and check that nothing is left behind.
# The CI machines are already administrators, so the helpers run with --elevate none.
name: Setup integration

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

env:
  # The setup downloads zapret through the GitHub API, which rate-limits shared CI IPs.
  GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Install and tune
        run: sudo --preserve-env=GITHUB_TOKEN "$(command -v python)" -m dpi_dashboard.setup install --elevate none --tries 1
      - name: Service is running and enabled
        run: |
          systemctl is-active zapret.service
          systemctl is-enabled zapret.service
          pgrep -a nfqws
          test -f /opt/zapret/.installed-by-dpi-dashboard
          sed -n '/^NFQWS_OPT=/,/^"/p' /opt/zapret/config
      - name: Status from the app's point of view
        run: |
          python -m dpi_dashboard.setup check | tee status.json
          python -c "import json; s = json.load(open('status.json')); assert s['service_found'] and s['managed'], s"
      - name: Internet still works with zapret on
        run: |
          python - <<'PY'
          from dpi_dashboard.probe import check_hosts
          r = check_hosts(["github.com", "example.com", "discord.com"], tries=2)
          for x in r:
              print(x.host, x.successes, x.reasons)
          assert all(x.successes == 2 for x in r)
          PY
      - name: Retune an existing install
        run: sudo "$(command -v python)" -m dpi_dashboard.setup tune --elevate none --tries 1
      - name: Uninstall
        run: |
          sudo "$(command -v python)" -m dpi_dashboard.setup uninstall --elevate none
          ! systemctl cat zapret.service 2>/dev/null
          test ! -e /opt/zapret
          ! pgrep nfqws
      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u zapret.service -n 60 --no-pager || true
          sudo sh -c 'cat /tmp/dpi-dashboard-setup-*/setup.log' || true

  # Other distributions, each in a container that boots systemd. The containers share the
  # CI machine's kernel: nfqws, NFQUEUE and the firewall are real, but SELinux is not
  # active (the Ubuntu host has none), so Fedora's SELinux handling is not exercised.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            prep: dnf -y install systemd python3 && dnf clean all
          - name: debian-12
            image: debian:12
            prep: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv python3 && rm -rf /var/lib/apt/lists/*
          - name: arch
            image: archlinux:latest
            prep: pacman -Syu --noconfirm systemd python && pacman -Scc --noconfirm
          - name: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
            prep: zypper -n install systemd python3 && zypper clean -a
    name: distro (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the netfilter modules zapret needs (shared host kernel)
        run: sudo modprobe -a nfnetlink_queue nft_queue xt_NFQUEUE || true
      - name: Build and boot
        run: |
          docker build -q -t distro --build-arg IMAGE='${{ matrix.image }}' --build-arg PREP='${{ matrix.prep }}' -f packaging/ci/distro.Dockerfile packaging/ci
          docker run -d --name dut --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD":/src:ro -e GITHUB_TOKEN distro
          for i in $(seq 60); do
            s=$(docker exec dut systemctl is-system-running 2>/dev/null || true)
            case "$s" in running|degraded) echo "systemd: $s"; break ;; esac
            sleep 2
          done
          docker exec dut sh -c 'cat /etc/os-release | head -2; python3 --version'
          for t in curl nft iptables awk pgrep; do docker exec dut sh -c "command -v $t >/dev/null && echo 'present: $t' || echo 'missing: $t'"; done
      - name: Install and tune
        run: docker exec -e PYTHONPATH=/src/src dut python3 -m dpi_dashboard.setup install --elevate none --tries 1
      - name: Service is running
        run: |
          docker exec dut systemctl is-active zapret.service
          docker exec dut systemctl is-enabled zapret.service
          docker exec dut sh -c 'grep -lx nfqws /proc/[0-9]*/comm'
      - name: Internet still works with zapret on
        run: |
          docker exec -e PYTHONPATH=/src/src dut python3 -c "from dpi_dashboard.probe import check_hosts; r = check_hosts(['github.com', 'example.com', 'discord.com'], tries=2); print([(x.host, x.successes, x.reasons) for x in r]); assert all(x.successes == 2 for x in r)"
      - name: Retune and uninstall
        run: |
          docker exec -e PYTHONPATH=/src/src dut python3 -m dpi_dashboard.setup tune --elevate none --tries 1
          docker exec -e PYTHONPATH=/src/src dut python3 -m dpi_dashboard.setup uninstall --elevate none
          docker exec dut sh -c '! systemctl cat zapret.service 2>/dev/null && test ! -e /opt/zapret'
      - name: Logs
        if: failure()
        run: |
          docker exec dut journalctl -u zapret.service -n 60 --no-pager || true
          docker exec dut sh -c 'cat /tmp/dpi-dashboard-setup-*/setup.log' || true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # --elevate auto: the same Start-Process -Verb RunAs path users go through (UAC is
      # off on the CI machines, so it does not wait for a click).
      - name: Install and tune (through RunAs)
        timeout-minutes: 15
        run: |
          python -m dpi_dashboard.setup install --elevate auto --tries 1
          if ($LASTEXITCODE -ne 0) { throw "setup failed: $LASTEXITCODE" }
      - name: Service is running and starts automatically
        run: |
          $s = Get-Service zapret
          $s | Format-List Name, Status, StartType
          if ($s.Status -ne 'Running') { throw 'service is not running' }
          if ($s.StartType -ne 'Automatic') { throw 'service is not automatic' }
          Get-Process winws
          (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\zapret).ImagePath
          if (-not (Test-Path "$env:ProgramFiles\zapret\.installed-by-dpi-dashboard")) { throw 'marker missing' }
      - name: Log folder is locked (users read, cannot write)
        run: |
          $users = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
          $deny = [System.Security.AccessControl.FileSystemRights]'Write, Delete, DeleteSubdirectoriesAndFiles, ChangePermissions, TakeOwnership'
          foreach ($p in "$env:ProgramData\dpi-dashboard", "$env:ProgramData\dpi-dashboard\logs") {
            $acl = Get-Acl -LiteralPath $p
            $acl.Access | Format-Table IdentityReference, FileSystemRights, IsInherited -AutoSize | Out-String | Write-Host
            if (-not $acl.AreAccessRulesProtected) { throw "$p inherits permissions" }
            $owner = $acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            if ($owner -notin 'S-1-5-32-544', 'S-1-5-18') { throw "$p is owned by $owner" }
            foreach ($r in $acl.Access) {
              $sid = $r.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier])
              if ($sid.Value -notin 'S-1-5-32-544', 'S-1-5-18', 'S-1-5-32-545') { throw "unexpected entry $sid on $p" }
              if ($sid -eq $users -and ($r.FileSystemRights -band $deny)) { throw "users can change $p" }
            }
          }
          if (Get-ChildItem "$env:ProgramData\dpi-dashboard" -Directory -Filter 'work-*') { throw 'work folder left behind' }
          Get-ChildItem "$env:ProgramData\dpi-dashboard\logs" | Format-Table Name, Length
      - name: Status from the app's point of view
        run: |
          python -m dpi_dashboard.setup check | Tee-Object status.json
          python -c "import json; s = json.load(open('status.json')); assert s['service_found'] and s['managed'], s"
      - name: Internet still works with zapret on
        run: |
          python -c "from dpi_dashboard.probe import check_hosts; r = check_hosts(['github.com', 'example.com', 'discord.com'], tries=2); print([(x.host, x.successes, x.reasons) for x in r]); assert all(x.successes == 2 for x in r)"
      - name: The app's own backend controls the service
        run: |
          python -c "from dpi_dashboard.backends import detect_backend; b = detect_backend(); print(b.label, b.state()); s = b.state(); assert b.service == 'zapret' and s.installed and s.active and s.enabled"
      - name: Retune an existing install
        run: |
          python -m dpi_dashboard.setup tune --elevate none --tries 1
          if ($LASTEXITCODE -ne 0) { throw "tune failed: $LASTEXITCODE" }
      - name: Uninstall
        run: |
          python -m dpi_dashboard.setup uninstall --elevate auto
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed: $LASTEXITCODE" }
          if (Get-Service zapret -ErrorAction SilentlyContinue) { throw 'service still exists' }
          if (Test-Path "$env:ProgramFiles\zapret") { throw 'folder still exists' }
          if (Get-Process winws -ErrorAction SilentlyContinue) { throw 'winws still running' }
      - name: Logs
        if: failure()
        run: Get-ChildItem $env:TEMP -Filter 'dpi-dashboard-setup-*' -Directory | ForEach-Object { Get-Content (Join-Path $_.FullName 'setup.log') -ErrorAction SilentlyContinue }
